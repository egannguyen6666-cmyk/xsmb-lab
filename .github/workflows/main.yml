name: Cập nhật xổ số hằng ngày (XSMB, XSMN, XSMT)

on:
  schedule:
    # Giờ UTC (VN = UTC+7). 16:40/16:55 sau XSMN, 17:40/17:55 sau XSMT, 18:40/19:40/22:40 sau XSMB
    - cron: "40 9,10 * * *"
    - cron: "55 9,10 * * *"
    - cron: "40 11,12,15 * * *"
  workflow_dispatch:
    inputs:
      ngay:
        description: "Nhập tay XSMB (không bắt buộc): ngày quay, dạng 2026-11-24"
        required: false
      ket_qua:
        description: "XSMB: 27 số theo thứ tự ĐB G1 G2(2) G3(6) G4(4) G5(6) G6(3) G7(4)"
        required: false
      mn_ngay:
        description: "Nhập tay XSMN (không bắt buộc): ngày quay, dạng 2026-11-24"
        required: false
      mn_dai:
        description: "XSMN: mã đài, ví dụ tp-hcm, dong-thap, ca-mau, bac-lieu, ben-tre, vung-tau"
        required: false
      mn_ket_qua:
        description: "XSMN: 18 số theo thứ tự ĐB G1 G2 G3(2) G4(7) G5 G6(3) G7 G8"
        required: false
      mt_ngay:
        description: "Nhập tay XSMT (không bắt buộc): ngày quay"
        required: false
      mt_dai:
        description: "XSMT: mã đài, ví dụ da-nang, khanh-hoa, thua-thien-hue, phu-yen, quang-nam, dak-lak"
        required: false
      mt_ket_qua:
        description: "XSMT: 18 số theo thứ tự ĐB G1 G2 G3(2) G4(7) G5 G6(3) G7 G8"
        required: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lấy kết quả vừa quay (bảng công khai Minh Ngọc)
        continue-on-error: true
        run: |
          python3 tools/fetch_minhngoc.py mn
          python3 tools/fetch_minhngoc.py mt
          python3 tools/fetch_minhngoc.py mb
      - name: Tải dữ liệu Vietlott (Keno, Mega 6/45, Power 6/55, Max 3D, Max 3D Pro)
        continue-on-error: true
        run: python3 tools/update_vietlott.py
      - name: Tải dữ liệu XSMB
        run: python3 tools/update.py xsmb.csv
      - name: Tải dữ liệu XSMN
        run: python3 tools/update_mn.py xsmn.csv
      - name: Tải dữ liệu XSMT
        run: python3 tools/update_mn.py xsmt.csv
      - name: Nhập tay XSMB (nếu có)
        if: ${{ github.event.inputs.ngay != '' && github.event.inputs.ket_qua != '' }}
        run: python3 tools/add_day.py xsmb.csv recent.json "${{ github.event.inputs.ngay }}" "${{ github.event.inputs.ket_qua }}"
      - name: Nhập tay XSMN (nếu có)
        if: ${{ github.event.inputs.mn_ngay != '' && github.event.inputs.mn_dai != '' && github.event.inputs.mn_ket_qua != '' }}
        run: python3 tools/add_day_mn.py xsmn.csv recent_mn.json "${{ github.event.inputs.mn_ngay }}" "${{ github.event.inputs.mn_dai }}" "${{ github.event.inputs.mn_ket_qua }}"
      - name: Nhập tay XSMT (nếu có)
        if: ${{ github.event.inputs.mt_ngay != '' && github.event.inputs.mt_dai != '' && github.event.inputs.mt_ket_qua != '' }}
        run: python3 tools/add_day_mn.py xsmt.csv recent_mt.json "${{ github.event.inputs.mt_ngay }}" "${{ github.event.inputs.mt_dai }}" "${{ github.event.inputs.mt_ket_qua }}"
      - name: Lưu thay đổi
        run: |
          git config user.name "xsmb-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add xsmb.csv recent.json xsmn.csv recent_mn.json xsmt.csv recent_mt.json vietlott_645.csv vietlott_655.csv vietlott_3d.csv vietlott_3dpro.csv vietlott_keno.csv
          git diff --cached --quiet && echo "Không có gì mới" || (git commit -m "Cập nhật dữ liệu $(TZ=Asia/Ho_Chi_Minh date +'%d/%m/%Y %H:%M')" && git pull --rebase -q && git push)
