name: Cập nhật xổ số hằng ngày (XSMB, XSMN, XSMT)

on:
  schedule:
    # Giờ UTC (VN = UTC+7). Chạy ngay khi từng miền quay xong, rồi chạy lại vài lần để chắc chắn:
    # XSMN 16:36, 16:42, 16:55 · XSMT 17:36, 17:42, 17:55 · XSMB 18:34, 18:38, 18:45, 19:40, 22:40
    - cron: "36 9,10 * * *"
    - cron: "42 9,10 * * *"
    - cron: "55 9,10 * * *"
    - cron: "34 11 * * *"
    - cron: "38 11 * * *"
    - cron: "45 11 * * *"
    - cron: "40 12,15 * * *"
  workflow_dispatch:
    inputs:
      ngay:
        description: "Nhập tay XSMB (không bắt buộc): ngày quay, dạng 2026-11-24"
        required: false
      ket_qua:
        description: "XSMB: 27 số theo thứ tự ĐB G1 G2(2) G3(6) G4(4) G5(6) G6(3) G7(4)"
        required: false
      mn_ngay:
        description: "Nhập tay XSMN (không bắt buộc): ngày quay, dạng 2026-11-24"
        required: false
      mn_dai:
        description: "XSMN: mã đài, ví dụ tp-hcm, dong-thap, ca-mau, bac-lieu, ben-tre, vung-tau"
        required: false
      mn_ket_qua:
        description: "XSMN: 18 số theo thứ tự ĐB G1 G2 G3(2) G4(7) G5 G6(3) G7 G8"
        required: false
      mt_ngay:
        description: "Nhập tay XSMT (không bắt buộc): ngày quay"
        required: false
      mt_dai:
        description: "XSMT: mã đài, ví dụ da-nang, khanh-hoa, thua-thien-hue, phu-yen, quang-nam, dak-lak"
        required: false
      mt_ket_qua:
        description: "XSMT: 18 số theo thứ tự ĐB G1 G2 G3(2) G4(7) G5 G6(3) G7 G8"
        required: false

permissions:
  contents: write
  pages: read

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lấy kết quả vừa quay (bảng công khai Minh Ngọc)
        continue-on-error: true
        run: |
          python3 tools/fetch_minhngoc.py mn
          python3 tools/fetch_minhngoc.py mt
          python3 tools/fetch_minhngoc.py mb
      - name: Tải dữ liệu Vietlott (Keno, Mega 6/45, Power 6/55, Max 3D, Max 3D Pro)
        continue-on-error: true
        run: python3 tools/update_vietlott.py
      - name: Tải dữ liệu XSMB
        run: python3 tools/update.py xsmb.csv
      - name: Tải dữ liệu XSMN
        run: python3 tools/update_mn.py xsmn.csv
      - name: Tải dữ liệu XSMT
        run: python3 tools/update_mn.py xsmt.csv
      - name: Nhập tay XSMB (nếu có)
        if: ${{ github.event.inputs.ngay != '' && github.event.inputs.ket_qua != '' }}
        env:
          IN_NGAY: ${{ github.event.inputs.ngay }}
          IN_KQ: ${{ github.event.inputs.ket_qua }}
        run: python3 tools/add_day.py xsmb.csv recent.json "$IN_NGAY" "$IN_KQ"
      - name: Nhập tay XSMN (nếu có)
        if: ${{ github.event.inputs.mn_ngay != '' && github.event.inputs.mn_dai != '' && github.event.inputs.mn_ket_qua != '' }}
        env:
          IN_NGAY: ${{ github.event.inputs.mn_ngay }}
          IN_DAI: ${{ github.event.inputs.mn_dai }}
          IN_KQ: ${{ github.event.inputs.mn_ket_qua }}
        run: python3 tools/add_day_mn.py xsmn.csv recent_mn.json "$IN_NGAY" "$IN_DAI" "$IN_KQ"
      - name: Nhập tay XSMT (nếu có)
        if: ${{ github.event.inputs.mt_ngay != '' && github.event.inputs.mt_dai != '' && github.event.inputs.mt_ket_qua != '' }}
        env:
          IN_NGAY: ${{ github.event.inputs.mt_ngay }}
          IN_DAI: ${{ github.event.inputs.mt_dai }}
          IN_KQ: ${{ github.event.inputs.mt_ket_qua }}
        run: python3 tools/add_day_mn.py xsmt.csv recent_mt.json "$IN_NGAY" "$IN_DAI" "$IN_KQ"
      - name: Lấy kết quả Keno mới nhất
        continue-on-error: true
        run: python3 tools/fetch_keno.py
      - name: Cập nhật dữ liệu đủ giải (3 càng, 4 càng)
        continue-on-error: true
        run: python3 tools/update_full.py
      - name: Tạo trang kết quả theo ngày, đài, thứ và sitemap
        run: python3 tools/make_pages.py
      - name: Tạo nguồn RSS
        run: python3 tools/make_rss.py
      - name: Lưu thay đổi
        id: save
        run: |
          git config user.name "xsmb-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Không có gì mới"; echo "pushed=0" >> "$GITHUB_OUTPUT"; else
            git commit -q -m "Cập nhật dữ liệu $(TZ=Asia/Ho_Chi_Minh date +'%d/%m/%Y %H:%M')" && bash tools/safe_push.sh "python3 tools/make_pages.py && python3 tools/make_rss.py" && echo "pushed=1" >> "$GITHUB_OUTPUT"; fi
      - name: Xoá bản lưu sẵn trên Cloudflare (để Google và người dùng thấy kết quả mới ngay)
        if: steps.save.outputs.pushed == '1'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ZONE_ID" ]; then echo "Chưa cấu hình khoá Cloudflare, bỏ qua"; exit 0; fi
          # chờ GitHub Pages đưa bản mới lên rồi mới xoá bản lưu sẵn
          for i in $(seq 1 30); do sleep 10; S=$(curl -s -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/${{ github.repository }}/pages/builds/latest" | python3 -c "import sys,json;print(json.load(sys.stdin).get('status',''))" 2>/dev/null); echo "Pages: $S"; [ "$S" = "built" ] && break; done
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" --data '{"purge_everything":true}' | python3 -c "import sys,json;r=json.load(sys.stdin);print('Đã xoá bản lưu sẵn' if r.get('success') else r)"

