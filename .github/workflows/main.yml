name: Cập nhật XSMB hằng ngày

on:
  schedule:
    # Giờ UTC. 11:40 UTC = 18:40 giờ VN, 12:40 = 19:40, 15:40 = 22:40
    - cron: "40 11,12,15 * * *"
  workflow_dispatch:
    inputs:
      ngay:
        description: "Nhập tay (không bắt buộc): ngày quay, dạng 2026-11-24"
        required: false
      ket_qua:
        description: "27 số theo thứ tự ĐB G1 G2(2) G3(6) G4(4) G5(6) G6(3) G7(4), cách nhau bằng dấu cách"
        required: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tải dữ liệu mới
        run: python3 tools/update.py xsmb.csv
      - name: Nhập tay kết quả (nếu có)
        if: ${{ github.event.inputs.ngay != '' && github.event.inputs.ket_qua != '' }}
        run: python3 tools/add_day.py xsmb.csv recent.json "${{ github.event.inputs.ngay }}" "${{ github.event.inputs.ket_qua }}"
      - name: Khóa danh sách cho kỳ tiếp theo
        run: node tools/predict.js xsmb.csv predictions.json
      - name: Lưu thay đổi
        run: |
          git config user.name "xsmb-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add xsmb.csv recent.json predictions.json
          git diff --cached --quiet && echo "Không có gì mới" || (git commit -m "Cập nhật dữ liệu $(TZ=Asia/Ho_Chi_Minh date +'%d/%m/%Y %H:%M')" && git push)
