name: Cập nhật Keno (15 phút một lần)

on:
  schedule:
    # Giờ UTC: 15 phút một lần từ 23:00 đến 15:45 UTC (06:00 – 22:45 giờ VN). GitHub có thể chạy trễ vài phút.
    - cron: "*/15 0-15,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  keno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lấy kết quả Keno mới nhất
        run: python3 tools/fetch_keno.py
      - name: Lưu thay đổi
        run: |
          git config user.name "xsmb-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add vietlott_keno.csv
          git diff --cached --quiet && echo "Không có gì mới" || (git commit -m "Cập nhật Keno $(TZ=Asia/Ho_Chi_Minh date +'%d/%m/%Y %H:%M')" && git pull --rebase -q && git push)
