name: Cập nhật Keno (15 phút một lần)

on:
  schedule:
    # Giờ UTC: 15 phút một lần từ 23:00 đến 15:45 UTC (06:00 – 22:45 giờ VN). GitHub có thể chạy trễ vài phút.
    - cron: "*/15 0-15,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  keno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lấy kết quả Keno mới nhất
        run: python3 tools/fetch_keno.py
      - name: Lưu thay đổi
        id: save
        run: |
          git config user.name "xsmb-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add vietlott_keno.csv
          if git diff --cached --quiet; then echo "Không có gì mới"; echo "pushed=0" >> "$GITHUB_OUTPUT"; else
            git commit -q -m "Cập nhật Keno $(TZ=Asia/Ho_Chi_Minh date +'%d/%m/%Y %H:%M')" && bash tools/safe_push.sh && echo "pushed=1" >> "$GITHUB_OUTPUT"; fi
      - name: Xoá bản lưu sẵn của trang Keno trên Cloudflare
        if: steps.save.outputs.pushed == '1'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ZONE_ID" ]; then echo "Chưa cấu hình khoá Cloudflare, bỏ qua"; exit 0; fi
          sleep 90
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" --data '{"files":["https://xslab.live/vietlott_keno.csv","https://xslab.live/keno/"]}' | python3 -c "import sys,json;r=json.load(sys.stdin);print('Đã xoá bản lưu sẵn' if r.get('success') else r)"

