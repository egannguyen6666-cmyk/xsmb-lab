name: Cập nhật Keno mỗi giờ

on:
  schedule:
    # Giờ UTC: phút 25 mỗi giờ từ 23:25 đến 15:25 UTC (06:25 – 22:25 giờ VN)
    - cron: "25 0-15,23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  keno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tải kết quả Keno
        run: python3 tools/update_vietlott.py keno
      - name: Lưu thay đổi
        run: |
          git config user.name "xsmb-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add vietlott_keno.csv
          git diff --cached --quiet && echo "Không có gì mới" || (git commit -m "Cập nhật Keno $(TZ=Asia/Ho_Chi_Minh date +'%d/%m/%Y %H:%M')" && git pull --rebase -q && git push)
