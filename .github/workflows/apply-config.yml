name: Áp cấu hình từ trang quản trị

# Chạy khi site-config.json đổi (trang xslab.live/admin lưu lên), dựng lại trang rồi xoá bản lưu sẵn trên Cloudflare.
on:
  push:
    branches: [main]
    paths: [site-config.json]
  workflow_dispatch:

permissions:
  contents: write
  pages: read

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm tra tệp cấu hình
        run: python3 -c "import json;json.load(open('site-config.json',encoding='utf-8'));print('site-config.json hợp lệ')"
      - name: Dựng lại trang với cấu hình mới
        run: |
          python3 tools/make_pages.py
          python3 tools/make_rss.py
      - name: Lưu thay đổi
        id: save
        run: |
          git config user.name "xsmb-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Không có gì đổi"; echo "pushed=0" >> "$GITHUB_OUTPUT"; else
            git commit -q -m "Áp cấu hình từ trang quản trị $(TZ=Asia/Ho_Chi_Minh date +'%d/%m/%Y %H:%M')" && bash tools/safe_push.sh "python3 tools/make_pages.py && python3 tools/make_rss.py" && echo "pushed=1" >> "$GITHUB_OUTPUT"; fi
      - name: Xoá bản lưu sẵn trên Cloudflare
        if: steps.save.outputs.pushed == '1' || github.event_name == 'push'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ZONE_ID" ]; then echo "Chưa cấu hình khoá Cloudflare, bỏ qua"; exit 0; fi
          for i in $(seq 1 30); do sleep 10; S=$(curl -s -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/${{ github.repository }}/pages/builds/latest" | python3 -c "import sys,json;print(json.load(sys.stdin).get('status',''))" 2>/dev/null); echo "Pages: $S"; [ "$S" = "built" ] && break; done
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" --data '{"purge_everything":true}' | python3 -c "import sys,json;r=json.load(sys.stdin);print('Đã xoá bản lưu sẵn' if r.get('success') else r)"
